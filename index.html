<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f2" />
  <meta name="description" content="个人使用的宏量营养、食物热量与体重趋势记录工具。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="营养计划" />
  <title>个人营养计划</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    ASSUMPTIONS
    - 单人使用，不需要账号、同步、社区或付费。
    - 食物数据来自 USDA FoodData Central 的公开下载数据，并在构建时生成本地中文索引。
    - 拍照识别暂时下线，当前版本优先验证食物检索、称重和记录流程。
    - 首次使用沿用视频示例：男性 85kg、每周运动 2–3 小时、目标 187/120/68g。

    DESIGN REASONING
    - 采用轻灰画布、白色圆角卡片、黑色胶囊按钮和细线图标，贴近小程序参考图的极简语言。
    - 食物库使用左侧分类和右侧条目列表，减少横向分类滚动。
    - 不使用 Logo、固定品牌色或参考图中的咖啡品牌素材。
  -->
  <div id="app">
    <div class="boot-screen" role="status">
      <strong>个人营养计划</strong>
      <span>正在读取本地记录…</span>
    </div>
  </div>
  <noscript>此应用需要启用 JavaScript 才能记录数据。</noscript>
  <script src="data.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
